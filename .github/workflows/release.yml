name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # git describe needs the previous tag for the compare link

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Build release package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./scripts/release.ps1 -Version $version

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $zip = "dist/TaskMgrLite-win-x64-$version.zip"
          $sha = "$zip.sha256"
          if (-not (Test-Path $zip)) { throw "missing $zip" }
          if (-not (Test-Path $sha)) { throw "missing $sha" }

          # Notes come from CHANGELOG.md. --generate-notes only lists merged PRs,
          # so direct commits to main produce an empty release body.
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)"
          $m = [regex]::Match($changelog, $pattern)
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $version" }

          $notes = $m.Groups[1].Value.Trim()
          $prev = git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>$null
          if ($LASTEXITCODE -eq 0 -and $prev) {
              $notes += "`n`n**Full Changelog**: https://github.com/${{ github.repository }}/compare/$prev...${{ github.ref_name }}"
          }
          $notes | Set-Content release-notes.md -Encoding utf8NoBOM

          gh release create "${{ github.ref_name }}" $zip $sha --title "TaskMgrLite $version" --notes-file release-notes.md --verify-tag

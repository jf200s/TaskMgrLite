name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Build release package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./scripts/release.ps1 -Version $version

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $zip = "dist/TaskMgrLite-win-x64-$version.zip"
          $sha = "$zip.sha256"
          if (-not (Test-Path $zip)) { throw "missing $zip" }
          if (-not (Test-Path $sha)) { throw "missing $sha" }
          gh release create "${{ github.ref_name }}" $zip $sha --title "TaskMgrLite $version" --generate-notes --verify-tag

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Build
        run: dotnet build src/TaskMgrLite/TaskMgrLite.csproj -c Release -v minimal

      - name: Self test
        shell: pwsh
        run: |
          $exe = "src/TaskMgrLite/bin/Release/net11.0-windows/TaskMgrLite.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }

      - name: Upload run log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: run-log
          path: src/TaskMgrLite/bin/Release/net11.0-windows/logs/run.log
          if-no-files-found: ignore
